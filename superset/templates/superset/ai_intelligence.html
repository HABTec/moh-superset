<!DOCTYPE html>
<html lang="en">
<head>
  {% from 'superset/partials/asset_bundle.html' import css_bundle, js_bundle with context %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Intelligence — MoH Analytics Portal</title>
  <style>
    html, body, #app { min-height: 100%; margin: 0; }
    body {
      background: #f5f7fb;
      color: #0a2540;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      min-height: 60px;
      box-sizing: border-box;
      border-bottom: 1px solid #d6e3ff;
      background: #fff;
    }
    header img { width: auto; height: 36px; }
    header strong { font-size: 1.1rem; }
    header a { margin-left: auto; color: #1a5cff; text-decoration: none; }
    main { max-width: 1080px; margin: 32px auto; padding: 0 20px; }
  </style>
  {{ css_bundle(assets_prefix, 'ai-intelligence') }}
</head>
<body>
  <input
    type="hidden"
    name="csrf_token"
    id="csrf_token"
    value="{{ csrf_token() if csrf_token else '' }}"
  >
  <header>
    <img src="/moh-static/logomohnewww.png" alt="Ministry of Health">
    <strong>AI Intelligence</strong>
    <a href="/">Back to portal</a>
  </header>
  <main><div id="app" data-bootstrap="{{ bootstrap_data }}"></div></main>
  {{ js_bundle(assets_prefix, 'ai-intelligence') }}
</body>
</html>
